# 用本仓库的代码构建镜像（docker compose up -d --build），而不是拉取上游的旧镜像
services:
  libretv:
    build: .
    image: libretv:local
    container_name: libretv
    ports:
      - "8899:8080" # 浏览器访问 http://服务器IP:8899
    environment:
      - PASSWORD=${PASSWORD:-your_password} # 必填：访问密码，务必改成自己的
      # - PASSWORD_HASH=   # 也可以只填密码的 SHA-256，不留明文；填了它可以不填 PASSWORD
      # - PROXY_URL=socks5://192.168.1.2:7890   # 可选：服务器访问资源站时走代理（http / socks4 / socks5）
    restart: unless-stopped
